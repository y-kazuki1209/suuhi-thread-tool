<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>絶対に起きれる目覚まし時計</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app" id="app">
  <header class="clock-header">
    <div class="now-time" id="nowTime">--:--</div>
    <div class="now-date" id="nowDate">----年--月--日（-）</div>
  </header>

  <section class="next-alarm" id="nextAlarmBox" hidden>
    <span class="next-alarm-label">次のアラーム</span>
    <span class="next-alarm-value" id="nextAlarmValue">--:--</span>
  </section>

  <section class="alarm-form">
    <h2>アラームを追加</h2>
    <form id="alarmForm">
      <div class="form-row">
        <label for="timeInput">時刻</label>
        <input type="time" id="timeInput" required>
      </div>
      <div class="form-row">
        <label for="labelInput">ラベル</label>
        <input type="text" id="labelInput" placeholder="例：出社">
      </div>
      <div class="form-row days-row">
        <label>繰り返し</label>
        <div class="days-picker" id="daysPicker">
          <button type="button" class="day-btn" data-day="1">月</button>
          <button type="button" class="day-btn" data-day="2">火</button>
          <button type="button" class="day-btn" data-day="3">水</button>
          <button type="button" class="day-btn" data-day="4">木</button>
          <button type="button" class="day-btn" data-day="5">金</button>
          <button type="button" class="day-btn" data-day="6">土</button>
          <button type="button" class="day-btn" data-day="0">日</button>
        </div>
      </div>
      <p class="hint">未選択の場合は「今日／明日だけ鳴る」1回限りのアラームになります。</p>

      <div class="form-row">
        <label for="mathToggle">計算問題を解かないと止められない</label>
        <input type="checkbox" id="mathToggle" checked>
      </div>
      <div class="form-row">
        <label for="snoozeLimitInput">スヌーズ回数の上限</label>
        <input type="number" id="snoozeLimitInput" min="0" max="10" value="3">
      </div>

      <button type="submit" class="primary-btn">アラームを追加</button>
    </form>
  </section>

  <section class="alarm-list">
    <h2>アラーム一覧</h2>
    <ul id="alarmList" class="alarm-items"></ul>
    <p class="empty-msg" id="emptyMsg">まだアラームがありません。</p>
  </section>

  <section class="warning-box" id="permissionWarning" hidden>
    ⚠️ このアプリはタブを開いたままにしておく必要があります（バックグラウンドのブラウザタブでは音が鳴らない場合があります）。可能であればこのタブをピン留めし、端末をスリープさせないでください。
  </section>

  <button class="test-btn" id="testBtn" type="button">🔔 テスト（今すぐ鳴らす）</button>
</main>

<!-- 鳴動中オーバーレイ -->
<div class="ringing-overlay" id="ringingOverlay" hidden>
  <div class="ringing-content">
    <div class="ringing-label">⏰ 起きる時間です！</div>
    <div class="ringing-time" id="ringingTime">--:--</div>
    <div class="ringing-alarm-label" id="ringingAlarmLabel"></div>
    <div class="snooze-status" id="snoozeStatus"></div>

    <div class="ringing-actions">
      <button class="snooze-btn" id="snoozeBtn" type="button">😴 あと5分スヌーズ</button>
      <button class="stop-btn" id="stopBtn" type="button">🛑 アラームを止める</button>
    </div>
  </div>
</div>

<!-- 計算チャレンジモーダル -->
<div class="math-modal" id="mathModal" hidden>
  <div class="math-content">
    <div class="math-progress" id="mathProgress">問題 1 / 3</div>
    <div class="math-question" id="mathQuestion">1 + 1 = ?</div>
    <input type="number" class="math-answer" id="mathAnswer" inputmode="numeric" autocomplete="off">
    <button class="primary-btn" id="mathSubmit" type="button">回答する</button>
    <div class="math-feedback" id="mathFeedback"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
